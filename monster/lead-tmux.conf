# tmux config for the lead server `tmux -L monster` (installed to ~/.config/monday/lead-tmux.conf).
# Leads are windows of session "leads" named after the lead; the name must stay (CCGram, monster-ctl).
# view-* sessions are viewers grouped with "leads" (mon, mac-leads.sh), one per screen; they go away on
# detach and are ignored by monster-ctl ls/status and CCGram (TMUX_SESSION_NAME=leads).
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string '#S:#W'
set -g status-left '[#S] '
set -g status-left-length 40
set -g automatic-rename off
set -g allow-rename off
set -g set-clipboard on
set -as terminal-features ",*:clipboard"

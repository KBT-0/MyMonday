name: shellcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint shell scripts
        run: |
          # Every file with a bash shebang, with or without a .sh extension.
          grep -rlE --exclude-dir=.git '^#!/usr/bin/env bash' . | xargs shellcheck -S style
      - name: Validate JSON
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
